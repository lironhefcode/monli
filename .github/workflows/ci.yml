name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace backend --include-workspace-root
      - run: npm run prisma:generate -w backend
      - run: npm run lint -w backend
      - run: npm run typecheck -w backend
      # No-op until the backend has a test script (issue #16).
      - run: npm test -w backend --if-present

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs `nuxt prepare`, which generates the tsconfigs in
      # .nuxt/ that typecheck reads.
      - run: npm ci --workspace frontend --include-workspace-root
      - run: npm run lint -w frontend
      - run: npm run typecheck -w frontend

  agent:
    # Both OSes: the agent has unix-only (statvfs) and windows-only (service)
    # code, and each side is only compiled on its own platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

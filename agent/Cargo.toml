[package]
name = "monli-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Monli monitoring agent"

[dependencies]
# Error type used throughout: any error can be turned into `anyhow::Error`
# with `?`, and `.context("...")` adds a human-readable message on the way up.
anyhow = "1"
# Command-line parsing. `derive` lets us describe the CLI as a struct.
clap = { version = "4", features = ["derive", "env"] }
# HTTP client. rustls = pure-Rust TLS, so the binary has no OpenSSL dependency
# and can be built fully static (musl).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# (De)serialization: struct <-> JSON (server API) and struct <-> TOML (config file).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Async runtime: timers, signals, and the thread pool that drives `async fn`s.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Typed error for HTTP failures (status code + server message).
thiserror = "2"
# Cross-platform hostname lookup.
hostname = "0.4"
# CPU, memory and disk readings, cross-platform.
sysinfo = "0.36"
# Lets traits have `async fn` methods and still be used as `dyn Trait`.
async-trait = "0.1"
# RFC 3339 timestamps (`recorded_at`) from `SystemTime`.
humantime = "2"

[target.'cfg(unix)'.dependencies]
# statvfs(), for inode usage (no safe wrapper in std or sysinfo).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Runs the agent as a Windows service and installs it (the Windows systemd).
windows-service = "0.8"
# Daily log files for the service, which has no console to log to.
tracing-appender = "0.2"

[build-dependencies]
# Windows manifest asking for admin, so double-clicking the exe shows a UAC
# prompt. Pure Rust, so it also works when cross-compiling from Linux.
embed-manifest = "1.5"

[profile.release]
# Smaller static binary: strip symbols, whole-program optimisation.
strip = true
lto = true
codegen-units = 1

# Local Docker iteration (docker-compose.dev.yml): release optimisations without
# whole-program LTO, with parallel codegen and incremental builds, so a source
# change relinks in seconds. Inheriting from release keeps build.rs embedding
# the Windows manifest (Cargo sets PROFILE=release for it).
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

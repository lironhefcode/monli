services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-monli}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monli_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monli} -d ${POSTGRES_DB:-monli}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Not published on purpose: agents must come through nginx so req.ip is
  # derived from a trusted X-Forwarded-For rather than a spoofable one.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-monli}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-monli}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      TRUST_PROXY: 172.28.0.10
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  monli_postgres_data:

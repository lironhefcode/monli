server {
    listen 80;

    # API. The trailing slash on proxy_pass strips the /api prefix, so
    # /api/targets/1 reaches Express as /targets/1.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA. Unknown paths fall back to index.html so client-side
    # routes (e.g. a reload on /alerts) resolve in the browser.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
